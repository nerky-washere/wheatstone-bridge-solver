<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-accent="cyan">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheatstone Bridge Engine | Advanced Solver</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="pulse-dot"></span>
                <h1>WHEATSTONE BRIDGE SOLVER</h1>
            </div>
            
            <div class="header-controls">
                <!-- Theme & Accent Switchers -->
                <div class="theme-switcher">
                    <button class="theme-btn" id="theme-toggle" title="Chuyển đổi Dark/Light Mode">🌙</button>
                    <div class="accent-pickers">
                        <span class="dot cyan" data-color="cyan" title="Electric Cyan"></span>
                        <span class="dot emerald" data-color="emerald" title="Emerald Green"></span>
                        <span class="dot purple" data-color="purple" title="Cyber Purple"></span>
                        <span class="dot amber" data-color="amber" title="Amber Gold"></span>
                    </div>
                </div>

                <!-- Unique Visitor Badge -->
                <div class="visitor-badge" id="visitor-counter">
                    👥 UNIQUE VISITORS: <span class="count-value">Loading...</span>
                </div>
            </div>
        </header>

        <!-- Main Dashboard Grid -->
        <main class="dashboard-grid">
            <!-- Control Panel (Left) -->
            <section class="panel control-panel">
                <div class="panel-header">
                    <h2>Circuit Parameters</h2>
                    <button id="preset-balanced" class="preset-btn">Load Balanced Preset</button>
                </div>

                <div class="input-group main-voltage">
                    <label for="vs">Nguồn điện (Vs) [V]</label>
                    <input type="number" id="vs" value="12" step="0.1">
                </div>

                <div class="resistors-grid">
                    <div class="input-group">
                        <label for="r1">R1 [Ω]</label>
                        <input type="number" id="r1" value="100" step="1">
                    </div>
                    <div class="input-group">
                        <label for="r2">R2 [Ω]</label>
                        <input type="number" id="r2" value="100" step="1">
                    </div>
                    <div class="input-group">
                        <label for="r3">R3 [Ω]</label>
                        <input type="number" id="r3" value="150" step="1">
                    </div>
                    <div class="input-group">
                        <label for="r4">R4 [Ω]</label>
                        <input type="number" id="r4" value="150" step="1">
                    </div>
                    <div class="input-group full-width">
                        <label for="r5">R5 (Điện kế / Ngánh giữa) [Ω]</label>
                        <input type="number" id="r5" value="220" step="1">
                    </div>
                </div>

                <button id="calculate-btn" class="primary-btn">Compute Circuit Matrix</button>
            </section>

            <!-- Visualizer & Results (Right) -->
            <section class="panel visual-panel">
                <div class="circuit-viewport">
                    <!-- Sơ đồ mạch SVG Tương tác -->
                    <svg id="bridge-svg" viewBox="0 0 500 300" width="100%" height="100%">
                        <!-- Đường dẫn dây dẫn -->
                        <path class="circuit-line" d="M 250 20 L 250 80 M 250 80 L 120 150 M 250 80 L 380 150 M 120 150 L 380 150 M 120 150 L 250 220 M 380 150 L 250 220 M 250 220 L 250 280" />
                        
                        <!-- Các nút mạch (Nodes) -->
                        <circle cx="250" cy="80" r="5" class="circuit-node" />
                        <circle cx="120" cy="150" r="5" class="circuit-node" />
                        <circle cx="380" cy="150" r="5" class="circuit-node" />
                        <circle cx="250" cy="220" r="5" class="circuit-node" />

                        <!-- Nhãn điện trở trên SVG -->
                        <text x="165" y="105" class="svg-label">R1</text>
                        <text x="315" y="105" class="svg-label">R3</text>
                        <text x="225" y="150" class="svg-label r5-label">R5</text>
                        <text x="165" y="200" class="svg-label">R2</text>
                        <text x="315" y="200" class="svg-label">R4</text>
                        <text x="265" y="50" class="svg-label vs-label">+Vs</text>
                    </svg>
                </div>

                <div class="results-card">
                    <div class="results-header">
                        <h3>Analysis Results</h3>
                        <div id="status-badge" class="status-badge unbalanced">Bridge Unbalanced</div>
                    </div>
                    
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <span>Dòng qua R5 (Ig)</span>
                            <strong id="ig-result">0.00 mA</strong>
                        </div>
                        <div class="metric-item">
                            <span>Điện trở tương đương (Req)</span>
                            <strong id="req-result">0.00 Ω</strong>
                        </div>
                        <div class="metric-item">
                            <span>Điện thế nút C (Vc)</span>
                            <strong id="vc-result">0.00 V</strong>
                        </div>
                        <div class="metric-item">
                            <span>Điện thế nút D (Vd)</span>
                            <strong id="vd-result">0.00 V</strong>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
